<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convertidor de Temperatura</title>
  <!-- botstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 bg-white p-4 rounded shadow">
        <h1 class="text-center mb-4">Convertidor °C → °F / K</h1>

        <!-- entrada de dtos -->
        <label class="form-label">Temperatura en Celsius:</label>
        <input type="text" id="celsius" class="form-control" placeholder="ej: 45">
        
        <button id="btnConvertir" class="btn btn-primary w-100 mt-3">Convertir</button>

        <!-- mensajes -->
        <div id="error" class="text-danger mt-3"></div>
        
        <!-- resultados -->
        <div id="resultado" class="mt-4 d-none">
          <p class="mb-1">Grados Kelvin: <span id="kelvin"></span></p>
          <p>Grados Fahrenheit: <span id="fahrenheit"></span></p>
        </div>
      </div>
    </div>
  </div>

  <!-- llamamos al archivo de javascript -->
  <script src="script.js"></script>
</body>
</html>
